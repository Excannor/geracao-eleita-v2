# Geração Eleita V2: o app redesenhado, servido à parte do app original.
#
# Tudo aqui tem nome próprio, com "-v2": o projeto do compose, os containers e a porta.
# Assim ele pode rodar na mesma máquina que o app original sem que um "docker compose up"
# daqui recrie ou derrube os containers de lá.
#
#   Porta no host: 8083 (troque com PORTA_V2 no .env se já estiver em uso)
#   Dados:         ./dados desta pasta (banco, backups e chaves próprias do V2)
#   Endereço:      o hostname público do túnel do V2, em CAMINHO_ENDERECO no .env
#
# O .env desta pasta (que o git ignora) guarda:
#   CLOUDFLARE_TUNNEL_TOKEN=...   token do túnel nomeado do V2 (nunca o do app original)
#   CAMINHO_ENDERECO=https://...  o endereço público do V2 (entra na assinatura do push)
#   PORTA_V2=8083                 opcional
name: geracao-eleita-v2

services:
  caminho:
    build:
      context: .
    container_name: geracao-eleita-v2
    restart: unless-stopped
    ports:
      - "${PORTA_V2:-8083}:8080"
    volumes:
      - "./dados:/app/dados"
    environment:
      CAMINHO_AMBIENTE: "v2"
      CAMINHO_ENDERECO: "${CAMINHO_ENDERECO:-}"

  # Túnel rápido: endereço trycloudflare novo a cada reinício, bom para um teste sem
  # configurar nada. Só sobe se pedido:
  #   docker compose --profile rapido up -d
  #   docker compose logs tunel | grep trycloudflare
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: geracao-eleita-v2-tunel
    restart: unless-stopped
    profiles: [rapido]
    depends_on: [caminho]
    command: tunnel --no-autoupdate --url http://caminho:8080

  # Túnel nomeado, endereço fixo. "network_mode: service:caminho" põe os dois na mesma
  # pilha de rede, então no painel da Cloudflare o serviço aponta para
  # http://localhost:8080 (a porta de dentro do container), e não para a do host.
  #
  # ATENÇÃO ao publicar: recriar o container "caminho" destrói a pilha de rede que este
  # usa, e o túnel fica no ar sem servir nada. Depois de todo deploy, reinicie os dois:
  #   docker compose up -d --build && docker compose restart tunel-fixo
  tunel-fixo:
    image: cloudflare/cloudflared:latest
    container_name: geracao-eleita-v2-tunel-fixo
    restart: unless-stopped
    network_mode: "service:caminho"
    depends_on: [caminho]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

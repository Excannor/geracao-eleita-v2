# Geração Eleita: o app e os túneis da Cloudflare.
#
# Tudo aqui tem nome próprio, com "-v2": o projeto do compose, os containers e a porta. Assim
# ele pode rodar na mesma máquina que outro projeto chamado geracao-eleita (porta 8082) sem
# que um "docker compose up" daqui recrie ou derrube os containers de lá. Não troque esses
# nomes nem a porta.
#
#   Porta no host: 8083, só nesta máquina (troque com PORTA_V2 no .env se já estiver em uso)
#   Dados:         ./dados desta pasta (banco, backups e chaves)
#   Endereço:      https://ge.off-sec.net, pelo túnel nomeado
#
# O .env desta pasta (que o git ignora) guarda:
#   CLOUDFLARE_TUNNEL_TOKEN=...   token do túnel nomeado de ge.off-sec.net
#   CAMINHO_ENDERECO=https://...  o endereço público do app (entra na assinatura do push)
#   PORTA_V2=8083                 opcional
#   CAMINHO_ADMIN=...             opcional: quem vê o Painel (padrão maarcos_e; vários com vírgula)
#   CAMINHO_CHAVE_NOTAS=...       OBRIGATÓRIA: 64 hexadecimais (openssl rand -hex 32). Cifra
#                                 reflexões, anotações e a Minha história no banco; sem ela o
#                                 app não sobe. Guarde uma cópia fora do servidor: perdida, os
#                                 textos não abrem mais. Para trocar: a antiga vai para
#                                 CAMINHO_CHAVE_NOTAS_ANTERIOR e a nova entra aqui.
#   CAMINHO_SMTP_*, CAMINHO_BACKUP_CHAVE, CAMINHO_BACKUP_MANTER, CAMINHO_PASTA_BACKUP: opcionais
#   (ver o topo de email.mjs para o e-mail).
name: geracao-eleita-v2

services:
  caminho:
    build:
      context: .
    container_name: geracao-eleita-v2
    restart: unless-stopped
    # Só nesta máquina: de fora, o caminho é o túnel da Cloudflare.
    ports:
      - "127.0.0.1:${PORTA_V2:-8083}:8080"
    volumes:
      - "./dados:/app/dados"
      # Backups cifrados: outra pasta/disco só se CAMINHO_PASTA_BACKUP estiver no .env DESTA
      # pasta. Sem ela, ficam em dados/backup desta pasta.
      - "${CAMINHO_PASTA_BACKUP:-./dados/backup}:/app/dados/backup"
    environment:
      CAMINHO_AMBIENTE: "v2"
      CAMINHO_ENDERECO: "${CAMINHO_ENDERECO:-https://ge.off-sec.net}"
      # Quem vê o Painel do app (Configurações): métricas sem nomes e os pedidos de senha.
      CAMINHO_ADMIN: "${CAMINHO_ADMIN:-maarcos_e}"
      # E-mail da senha esquecida: desligado enquanto CAMINHO_SMTP_HOST estiver vazio no .env.
      CAMINHO_SMTP_HOST: "${CAMINHO_SMTP_HOST:-}"
      CAMINHO_SMTP_PORTA: "${CAMINHO_SMTP_PORTA:-465}"
      CAMINHO_SMTP_USUARIO: "${CAMINHO_SMTP_USUARIO:-}"
      CAMINHO_SMTP_SENHA: "${CAMINHO_SMTP_SENHA:-}"
      CAMINHO_SMTP_DE: "${CAMINHO_SMTP_DE:-}"
      # Chave dos backups cifrados (no .env, fora de dados/). Sem a chave, o backup não abre.
      CAMINHO_BACKUP_CHAVE: "${CAMINHO_BACKUP_CHAVE:-}"
      CAMINHO_BACKUP_MANTER: "${CAMINHO_BACKUP_MANTER:-14}"
      # Chave das anotações (obrigatória, no .env). Sem ela o container não sobe.
      CAMINHO_CHAVE_NOTAS: "${CAMINHO_CHAVE_NOTAS:-}"
      CAMINHO_CHAVE_NOTAS_ANTERIOR: "${CAMINHO_CHAVE_NOTAS_ANTERIOR:-}"

  # Túnel rápido: endereço trycloudflare novo a cada reinício. Só sobe se pedido:
  #   docker compose --profile rapido up -d
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: geracao-eleita-v2-tunel
    restart: unless-stopped
    profiles: [rapido]
    depends_on: [caminho]
    command: tunnel --no-autoupdate --url http://caminho:8080

  # Túnel nomeado (ge.off-sec.net). "network_mode: service:caminho" põe os dois na mesma
  # pilha de rede, então no painel da Cloudflare o serviço aponta para
  # http://localhost:8080 (a porta de dentro do container), e não para a do host.
  #
  # ATENÇÃO ao publicar: recriar o container "caminho" destrói a pilha de rede que este
  # usa, e o túnel fica no ar sem servir nada. Depois de todo deploy, recrie o túnel também
  # (o publicar.ps1 já faz isso):
  #   docker compose up -d --build caminho && docker compose up -d --force-recreate tunel-fixo
  tunel-fixo:
    image: cloudflare/cloudflared:latest
    container_name: geracao-eleita-v2-tunel-fixo
    restart: unless-stopped
    network_mode: "service:caminho"
    depends_on: [caminho]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

<!-- o joio e o trigo (Mt 13.24-30): de noite, no campo semeado, o trigo e o joio crescendo juntos, misturados na mesma fileira; o trigo tem a espiga cheia, em pares, com as barbas; o joio é mais fino e comprido, com as espiguetas pequenas e soltas, coladas na haste. No alto, a lua crescente e duas estrelas, porque o inimigo semeou o joio enquanto todos dormiam. Mais largo que os outros desenhos (160 por 124): é o desenho do alto da página da parábola. As espigas do trigo são a única área sálvia. -->

<!-- a cruz no alto do monte, para "Deuteronômio e Cristo" (Dt 21.23; Gl 3.13: "pendurado num madeiro"): a cruz menor, com a tabuleta, no cume de um monte alto e largo, e o caminho subindo até o pé dela (as beiras se abrem para baixo). Com a cruz grande sobre um monte raso, parecia uma sepultura. Feito para o disco: as pontas mais longe do centro (60,60) são os pés do monte (50 de distância) e a tabuleta (42), dentro do raio 54 com o traço -->

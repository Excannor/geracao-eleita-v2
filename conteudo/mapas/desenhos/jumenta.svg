<!-- a jumenta de Balaão (Nm 22.23-31): cabeça e pescoço de perfil, orelhas compridas em pé,
     cabresto com a correia do queixo que vai da argola até a beira de trás do pescoço (nada de linha solta saindo do desenho). O pescoço fica aberto embaixo
     (o papel fecha sem traço), para não parecer busto cortado. O cabresto fecha na argola (focinheira e peça da face),
     e a parte de dentro da orelha da frente é a única área em sálvia. -->

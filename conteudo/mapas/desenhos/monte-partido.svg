<!-- o monte das Oliveiras partido ao meio (Zc 14.4-5): duas metades de um monte largo e baixo, cada uma descendo até o chão numa curva, com a face partida em dentes virada para o meio. Entre elas, o vale largo: a linha do fundo e o caminho de fuga com as beiras se abrindo para baixo, em sálvia (o vale vai antes das metades, que cobrem as pontas). Uma oliveira pequena na encosta de cada metade, com o tronco entrando na copa. O chão vai antes de tudo. -->

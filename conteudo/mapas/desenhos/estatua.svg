<!-- a estátua do sonho de Nabucodonosor (Dn 2.31-34): uma estátua de frente, rígida, de braços colados ao corpo, sobre um pedestal de pedra, com as faixas de material de cima para baixo: a cabeça de ouro (a única área sálvia, sem rosto), o peito e os braços de prata (lisos, com dois riscos de brilho), o ventre de bronze (hachura inclinada), as pernas de ferro (hachura cruzada) e os pés de ferro e barro (pedaços escuros no barro claro), com uma rachadura. A pedra cortada da montanha vem pelo ar na direção dos pés. O chão e o pedestal vêm antes da estátua. -->

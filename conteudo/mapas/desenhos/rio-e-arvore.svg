<!-- o rio que sai do templo e as árvores das margens (Ez 47.1, 12; Ap 22.1-2): a fachada pequena do templo no alto, o rio saindo por baixo da porta, estreito perto do templo e largo embaixo, com ondas de traço, e uma árvore frutífera de cada lado, de copa redonda com frutas em bolinhas espalhadas (em fileira, viravam olhos). O rio é a única área sálvia. Tudo cabe num círculo de raio 54 em volta de (60,60), porque em "Ezequiel e Cristo" o desenho fica sobre um disco. -->

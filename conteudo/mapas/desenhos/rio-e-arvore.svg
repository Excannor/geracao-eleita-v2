<!-- o rio que sai do templo e as árvores das margens (Ez 47.1, 12; Ap 22.1-2): a fachada do templo no alto, como nos outros templos do app (cornija reta, duas colunas com capitel, porta em arco e dois degraus), e a água saindo por baixo da porta, descendo os degraus e alargando até embaixo, com ondas de traço. Uma árvore frutífera em cada margem, mais baixa que o templo para não cobrir as colunas, de copa redonda com frutinhas escuras espalhadas sem ordem (em fileira ou com riscos de folha, viravam rosto). O rio é a única área sálvia. Tudo cabe num círculo de raio 54 em volta de (60,60), porque em "Ezequiel e Cristo" o desenho fica sobre um disco. -->

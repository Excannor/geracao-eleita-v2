<!-- o fariseu e o cobrador de impostos no templo (Lc 18.10-13): à direita, o templo com as duas colunas e a porta; no chão, dois pares de pegadas de pés parados, virados para o templo, um bem na frente da porta e o outro lá atrás, longe, no canto esquerdo. Mais largo que os outros desenhos (160 por 124): é o desenho do alto da página da parábola. A porta do templo é a única área sálvia. -->

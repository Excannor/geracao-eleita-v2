<body>
<!-- Sem a marca de sessão (cc_logado, que o servidor põe e tira junto com o crachá), o app
     guardado pelo service worker não pinta nada: some e vai direto para a página de entrada.
     Antes, quem tinha saído (ou cuja sessão venceu) via a trilha do localStorage piscar até o
     /api/quem responder 401. Vem antes da abertura e do app, então nenhum quadro do app sai.
     Antes de tudo, guarda o aviso de instalar do navegador (beforeinstallprompt): ele chega uma
     vez por página e pode vir antes de o app existir (07c-instalar.js o lê daqui). -->
<script>addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__pedidoInstalar=e});addEventListener('appinstalled',function(){window.__pedidoInstalar=null;window.__appInstalado=1});if(/^http/.test(location.protocol)&&!/(?:^|;\s*)cc_logado=1/.test(document.cookie)){document.documentElement.classList.add('sem-sessao');document.documentElement.style.visibility='hidden';try{sessionStorage.setItem('cc.semMarca','1')}catch(e){}location.replace('entrar.html'+location.search+location.hash)}try{var t=localStorage.getItem('cc.tema');if(t!==null)document.documentElement.dataset.tema=JSON.parse(t)?'escuro':'claro'}catch(e){}try{var s=sessionStorage;if(s.getItem('cc.abertura.segue')){s.removeItem('cc.abertura.segue');document.documentElement.classList.add('abertura-segue')}else if(s.getItem('cc.abertura'))document.documentElement.classList.add('sem-abertura')}catch(e){}if(navigator.standalone===true||/[?&]app-ios(&|$)/.test(location.search))document.documentElement.classList.add('app-ios')</script>
/*ABERTURA*/
<div class="aplicativo">
  <header class="topo" id="topo"></header>
  <main class="corpo">
    <div class="conteudo" id="conteudo"></div>
  </main>
</div>
<nav class="navegacao" id="navegacao" aria-label="Navegação principal"></nav>
<script>/*DADOS*/</script>
<script>/*APP*/</script>
</body>
